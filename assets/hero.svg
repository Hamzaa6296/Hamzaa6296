<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="Animated terminal showing an AI agent turning an idea into a shipped product" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="850" y2="390"><stop offset="0" stop-color="#7c3aed"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<filter id="b" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="4"/></filter>
<clipPath id="inner"><rect x="11" y="56" width="838" height="333"/></clipPath>
<style>.t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:15px}.ti{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;font-size:13px;fill:#8b949e}#term{animation:fade 16.0s infinite}@keyframes fade{0%{opacity:0}2%{opacity:1}90%{opacity:1}95%{opacity:0}100%{opacity:0}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}#cursor{animation:showcur 16.0s infinite}@keyframes showcur{0%,68.74%{opacity:0}68.75%,100%{opacity:1}}@keyframes c0{0%,5.00%{transform:translateX(0)}15.62%,100%{transform:translateX(522px)}}@keyframes c1{0%,18.12%{transform:translateX(0)}25.00%,100%{transform:translateX(507px)}}@keyframes c2{0%,26.25%{transform:translateX(0)}32.50%,100%{transform:translateX(606px)}}@keyframes c3{0%,34.38%{transform:translateX(0)}40.62%,100%{transform:translateX(680px)}}@keyframes c4{0%,42.50%{transform:translateX(0)}48.75%,100%{transform:translateX(643px)}}@keyframes c5{0%,50.62%{transform:translateX(0)}56.88%,100%{transform:translateX(643px)}}@keyframes c6{0%,59.38%{transform:translateX(0)}67.50%,100%{transform:translateX(599px)}}</style>
</defs>
<rect x="10" y="10" width="840" height="380" rx="14" fill="#0d1117"/>
<rect x="10" y="10" width="840" height="380" rx="14" fill="none" stroke="#30363d" stroke-width="1.5"/>
<rect x="10" y="10" width="840" height="380" rx="14" fill="none" stroke="url(#g)" stroke-width="5" opacity="0.55" filter="url(#b)" pathLength="1000" stroke-dasharray="90 910"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="6s" repeatCount="indefinite"/></rect>
<rect x="10" y="10" width="840" height="380" rx="14" fill="none" stroke="url(#g)" stroke-width="2" pathLength="1000" stroke-dasharray="90 910"><animate attributeName="stroke-dashoffset" from="0" to="-1000" dur="6s" repeatCount="indefinite"/></rect>
<circle cx="36" cy="33" r="6" fill="#ff5f56"/><circle cx="58" cy="33" r="6" fill="#ffbd2e"/><circle class="pulse" cx="80" cy="33" r="6" fill="#27c93f"/>
<text class="ti" x="430" y="38" text-anchor="middle">ali-hamza ~ agent.run</text>
<text class="ti" x="796" y="38" text-anchor="end">online</text><circle class="pulse" cx="812" cy="33" r="4" fill="#3fb950"/>
<line x1="11" y1="56" x2="849" y2="56" stroke="#21262d" stroke-width="1"/>
<g id="term" clip-path="url(#inner)"><g><text class="t" x="48" y="110" fill="#3fb950" font-weight="700">$</text><text class="t" x="72" y="110" fill="#e6edf3">agent --task "ship my idea as an AI-powered product"</text><rect x="40" y="91" width="522" height="28" fill="#0d1117" style="animation:c0 16.0s steps(56,end) infinite"/></g><g><text class="t" x="48" y="144" fill="#bc8cff" font-weight="700">[plan]</text><text class="t" x="130" y="144" fill="#c9d1d9">scope → NestJS API · Next.js app · LLM layer</text><rect x="40" y="125" width="507" height="28" fill="#0d1117" style="animation:c1 16.0s steps(55,end) infinite"/></g><g><text class="t" x="48" y="178" fill="#39c5cf" font-weight="700">[tool]</text><text class="t" x="130" y="178" fill="#e6edf3">api.scaffold()</text><text class="t" x="380" y="178" fill="#3fb950">✓</text><text class="t" x="404" y="178" fill="#8b949e">typed, documented, secure</text><rect x="40" y="159" width="606" height="28" fill="#0d1117" style="animation:c2 16.0s steps(65,end) infinite"/></g><g><text class="t" x="48" y="212" fill="#39c5cf" font-weight="700">[tool]</text><text class="t" x="130" y="212" fill="#e6edf3">rag.index(your_docs)</text><text class="t" x="380" y="212" fill="#3fb950">✓</text><text class="t" x="404" y="212" fill="#8b949e">answers grounded in your own data</text><rect x="40" y="193" width="680" height="28" fill="#0d1117" style="animation:c3 16.0s steps(73,end) infinite"/></g><g><text class="t" x="48" y="246" fill="#39c5cf" font-weight="700">[tool]</text><text class="t" x="130" y="246" fill="#e6edf3">agent.wire(tools)</text><text class="t" x="380" y="246" fill="#3fb950">✓</text><text class="t" x="404" y="246" fill="#8b949e">agents that take real actions</text><rect x="40" y="227" width="643" height="28" fill="#0d1117" style="animation:c4 16.0s steps(69,end) infinite"/></g><g><text class="t" x="48" y="280" fill="#39c5cf" font-weight="700">[tool]</text><text class="t" x="130" y="280" fill="#e6edf3">ship(docker, ci)</text><text class="t" x="380" y="280" fill="#3fb950">✓</text><text class="t" x="404" y="280" fill="#8b949e">deployed, not stuck in a demo</text><rect x="40" y="261" width="643" height="28" fill="#0d1117" style="animation:c5 16.0s steps(69,end) infinite"/></g><g><text class="t" x="48" y="314" fill="#3fb950" font-weight="700">[done]</text><text class="t" x="130" y="314" fill="#e6edf3">your product is live → say hi below, let's build yours</text><rect x="40" y="295" width="599" height="28" fill="#0d1117" style="animation:c6 16.0s steps(65,end) infinite"/></g><g id="cursor"><text class="t" x="48" y="348" fill="#3fb950" font-weight="700">$</text><rect class="blink" x="72" y="334" width="9" height="18" fill="#e6edf3"/></g></g>
</svg>